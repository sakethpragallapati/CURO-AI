name: Deploy Backend to Hugging Face Spaces

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          # Go to the backend directory, as this is what we want to deploy
          cd backend
          
          # Initialize a temporary git repository
          git init
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Add and commit the backend files
          git add .
          git commit -m "Deploy backend from GitHub Actions"
          
          # Force push to the Hugging Face Space repository
          # This replaces the contents of the target repository with the backend/ folder
          git push --force https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME HEAD:main
